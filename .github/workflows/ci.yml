name: quality

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check src tests orchestration
      - run: pytest --cov=coastcast --cov-report=term-missing
      - name: Verify deployable runtime assets
        run: |
          test -f data/gold/features.parquet
          test -f artifacts/runtime/model_bundle.joblib
          test -f artifacts/runtime/metrics.json
          test -f artifacts/runtime/signature.json
          test -f artifacts/runtime/test_predictions.parquet
      - run: docker build -t coastcast-vestland:test .
