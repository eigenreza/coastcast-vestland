project:
  name: CoastCast Vestland
  timezone: UTC
  allowed_years: [2022, 2023, 2024, 2025]
period:
  start: "2022-01-01T00:00:00Z"
  end: "2025-12-31T23:00:00Z"
location:
  name: Bergen tide gauge
  station_code: BGO
  latitude: 60.398046
  longitude: 5.320487
  reference_level: MSL
ingestion:
  water_chunk_days: 31
  weather_chunk_days: 366
  timeout_seconds: 60
  retries: 4
  backoff_seconds: 2
  user_agent: "CoastCastVestland/0.1 data-pipeline"
  weather_model: ecmwf_ifs
  weather_variables: [pressure_msl, wind_speed_10m, wind_direction_10m, wind_gusts_10m, precipitation, temperature_2m]
features:
  horizons: [1, 3, 6, 12]
  lag_hours: [1, 2, 3, 6, 12, 24, 48]
  rolling_windows: [3, 6, 12, 24]
  maximum_missing_fraction: 0.05
model:
  random_state: 42
  validation_start: "2023-01-01T00:00:00Z"
  validation_window_months: 12
  calibration_start: "2024-01-01T00:00:00Z"
  test_start: "2025-01-01T00:00:00Z"
  interval_alpha: 0.10
  n_estimators: 250
  learning_rate: 0.05
  max_depth: 5
  min_samples_leaf: 15
paths:
  raw: data/raw
  bronze: data/bronze
  silver: data/silver
  gold: data/gold
  database: data/lakehouse.duckdb
  artifacts: artifacts/runtime
  reports: reports/generated
