[build-system]
requires = ["setuptools>=83", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "coastcast-vestland"
version = "0.1.0"
description = "Short-horizon coastal water-level forecasting for Bergen and Vestland"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "Reza Azad Gholami"}]
dependencies = [
  "duckdb>=1.1,<2",
  "fastapi>=0.141,<1",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pillow>=12.3,<13",
  "plotly>=5.24,<7",
  "pyarrow>=23.0.1,<24",
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.54,<2",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "dbt-duckdb>=1.8,<2",
  "mypy>=1.12,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.7,<1",
]
orchestration = ["apache-airflow>=2.10,<3.1"]

[project.scripts]
coastcast = "coastcast.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: tests that use filesystem or service boundaries",
  "network: tests that call external data providers",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.coverage.run]
source = ["coastcast"]
branch = true
